<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>深蹲教練</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: rgba(12, 18, 32, 0.78);
    --line: rgba(255,255,255,0.14);
    --text: #f4f7fb;
    --muted: #9db0c9;
    --accent: #3ddc97;
    --warn: #ffb020;
    --bad: #ff5d6c;
    --ok: #3ddc97;
    --btn: #1b2740;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { position: relative; width: 100%; height: 100%; }
  #stage {
    position: absolute; inset: 0; background: #000; overflow: hidden;
  }
  #video {
    position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
  }
  #canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000; pointer-events: none;
  }
  .mirror { transform: scaleX(-1); }
  #hud {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    pointer-events: none; z-index: 5;
  }
  #hud > * { pointer-events: auto; }
  .topbar, .bottombar, .sidepanel {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--line);
  }
  .topbar {
    margin: 10px; border-radius: 16px; padding: 10px 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .brand { font-weight: 800; letter-spacing: 0.04em; font-size: 16px; margin-right: auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--btn); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 700;
  }
  button, select, input[type="range"] {
    font: inherit; color: var(--text);
  }
  button, select {
    background: var(--btn); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; font-weight: 700; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #062016; border-color: transparent; }
  button.danger { background: var(--bad); color: #fff; border-color: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .metrics {
    margin: 0 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  @media (max-width: 520px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .metric .value { font-size: clamp(24px, 9vw, 40px); }
  }
  .metric {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 10px 8px; text-align: center; backdrop-filter: blur(10px);
  }
  .metric .label { color: var(--muted); font-size: 12px; font-weight: 700; }
  .metric .value { font-size: clamp(28px, 8vw, 48px); font-weight: 900; line-height: 1.1; margin-top: 2px; }
  .metric .unit { color: var(--muted); font-size: 12px; }
  #cue {
    margin: 10px; text-align: center; font-size: clamp(28px, 9vw, 56px);
    font-weight: 900; text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    min-height: 1.2em; color: #fff;
  }
  #cue.ok { color: var(--ok); }
  #cue.warn { color: var(--warn); }
  #cue.bad { color: var(--bad); }
  .spacer { flex: 1; }
  .bottombar {
    margin: 10px; border-radius: 18px; padding: 12px;
    display: grid; gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row.spread { justify-content: space-between; }
  .grow { flex: 1 1 auto; }
  .status { color: var(--muted); font-size: 13px; font-weight: 600; }
  .tiny { font-size: 12px; color: var(--muted); }
  details.history {
    margin: 0 10px 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 8px 12px; max-height: 34vh; overflow: auto;
  }
  details.history summary { cursor: pointer; font-weight: 800; padding: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 700; }
  .modal-bg {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 20;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    width: min(560px, 100%); background: #121a2b; border-radius: 20px 20px 0 0;
    border: 1px solid var(--line); padding: 16px; max-height: 70vh; overflow: auto;
  }
  .modal h3 { margin: 0 0 10px; }
  .field { margin: 10px 0; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .field input[type="range"] { width: 100%; }
  .help {
    color: var(--muted); font-size: 13px; line-height: 1.5;
  }
  #boot {
    position: absolute; inset: 0; z-index: 30; display: flex; align-items: center;
    justify-content: center; background: #0b1220; text-align: center; padding: 24px;
  }
  #boot.hidden { display: none; }
  #boot .card {
    max-width: 420px; background: #121a2b; border: 1px solid var(--line);
    border-radius: 20px; padding: 22px; width: 100%;
  }
  #boot h1 { margin: 0 0 8px; font-size: 28px; }
  #boot p { color: var(--muted); margin: 0 0 16px; line-height: 1.55; }
  #boot .steps { text-align: left; color: var(--text); margin: 0 0 18px; padding-left: 18px; line-height: 1.7; }
  #err { color: var(--bad); font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <div id="boot">
    <div class="card">
      <h1>深蹲教練</h1>
      <p>把舊手機架在三腳架上，側面拍攝，即可即時看膝蓋角度、深度與次數。</p>
      <ol class="steps">
        <li>手機側放，鏡頭約在髖部高度</li>
        <li>距離約 2–3 公尺，全身入鏡</li>
        <li>建議選「側面」，較準</li>
        <li>按下方開始，允許相機權限</li>
      </ol>
      <button class="primary grow" id="btnBootStart" style="width:100%">開始使用</button>
      <div id="err"></div>
    </div>
  </div>

  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="hud">
    <div class="topbar">
      <div class="brand">深蹲教練</div>
      <span class="chip" id="fpsChip">— FPS</span>
      <span class="chip" id="stateChip">待機</span>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="label">次數</div>
        <div class="value" id="repVal">0</div>
        <div class="unit">rep</div>
      </div>
      <div class="metric">
        <div class="label" id="angLabel">膝蓋角</div>
        <div class="value" id="angVal">—</div>
        <div class="unit">度</div>
      </div>
      <div class="metric">
        <div class="label" id="hipLabel">髖角</div>
        <div class="value" id="hipVal">—</div>
        <div class="unit">度</div>
      </div>
      <div class="metric">
        <div class="label" id="secLabel">軀幹前傾</div>
        <div class="value" id="secVal">—</div>
        <div class="unit">度</div>
      </div>
    </div>

    <div id="cue">準備好再開始</div>
    <div class="spacer"></div>

    <details class="history" id="historyBox">
      <summary>訓練紀錄</summary>
      <div class="row" style="margin:8px 0">
        <button id="btnExport">匯出 CSV</button>
        <button class="danger" id="btnClearHist">清除紀錄</button>
      </div>
      <div id="histTableWrap"><p class="tiny">尚無紀錄</p></div>
    </details>

    <div class="bottombar">
      <div class="row">
        <button id="btnToggleView" class="grow">檢視：側面</button>
        <button id="btnCam" class="grow">鏡頭：後</button>
        <button id="btnSettings">設定</button>
      </div>
      <div class="row">
        <button class="primary grow" id="btnStart">開始偵測</button>
        <button class="danger grow" id="btnStop" disabled>停止並儲存</button>
      </div>
      <div class="row spread">
        <label class="chip"><input type="checkbox" id="chkVoice" checked style="accent-color:#3ddc97" /> 語音報數</label>
        <span class="status" id="statusText">模型載入中…</span>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="settingsModal">
    <div class="modal">
      <h3>設定</h3>
      <div class="field">
        <label>蹲下判定角度（越小越深才算到底）&nbsp;<span id="downLabel">100</span>°</label>
        <input type="range" id="rngDown" min="70" max="130" value="100" />
      </div>
      <div class="field">
        <label>站直判定角度&nbsp;<span id="upLabel">160</span>°</label>
        <input type="range" id="rngUp" min="140" max="175" value="160" />
      </div>
      <div class="field">
        <label>深度達標膝蓋角（≤ 此值）&nbsp;<span id="depthLabel">90</span>°</label>
        <input type="range" id="rngDepth" min="70" max="110" value="90" />
      </div>
      <div class="field">
        <label>前傾警告（≥ 此值）&nbsp;<span id="leanLabel">35</span>°</label>
        <input type="range" id="rngLean" min="20" max="55" value="35" />
      </div>
      <p class="help">側面：顯示膝蓋角、髖角、軀幹前傾。<br/>正面：顯示左右膝角差與膝蓋內夾提示。<br/>舊手機若變慢會自動降到約 15 FPS。</p>
      <div class="row" style="margin-top:12px">
        <button class="primary grow" id="btnCloseSettings">完成</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import {
  FilesetResolver,
  PoseLandmarker,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

const LS_KEY = "squatCoach.sessions.v1";
const LS_SET = "squatCoach.settings.v1";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const boot = document.getElementById("boot");
const errEl = document.getElementById("err");

const els = {
  fpsChip: document.getElementById("fpsChip"),
  stateChip: document.getElementById("stateChip"),
  repVal: document.getElementById("repVal"),
  angLabel: document.getElementById("angLabel"),
  angVal: document.getElementById("angVal"),
  hipLabel: document.getElementById("hipLabel"),
  hipVal: document.getElementById("hipVal"),
  secLabel: document.getElementById("secLabel"),
  secVal: document.getElementById("secVal"),
  cue: document.getElementById("cue"),
  statusText: document.getElementById("statusText"),
  btnStart: document.getElementById("btnStart"),
  btnStop: document.getElementById("btnStop"),
  btnToggleView: document.getElementById("btnToggleView"),
  btnCam: document.getElementById("btnCam"),
  btnSettings: document.getElementById("btnSettings"),
  btnBootStart: document.getElementById("btnBootStart"),
  chkVoice: document.getElementById("chkVoice"),
  histTableWrap: document.getElementById("histTableWrap"),
  btnExport: document.getElementById("btnExport"),
  btnClearHist: document.getElementById("btnClearHist"),
  settingsModal: document.getElementById("settingsModal"),
  btnCloseSettings: document.getElementById("btnCloseSettings"),
  rngDown: document.getElementById("rngDown"),
  rngUp: document.getElementById("rngUp"),
  rngDepth: document.getElementById("rngDepth"),
  rngLean: document.getElementById("rngLean"),
  downLabel: document.getElementById("downLabel"),
  upLabel: document.getElementById("upLabel"),
  depthLabel: document.getElementById("depthLabel"),
  leanLabel: document.getElementById("leanLabel"),
};

let poseLandmarker = null;
let drawingUtils = null;
let running = false;
let stream = null;
let facingMode = "environment"; // back
let viewMode = "side"; // side | front
let wakeLock = null;
let rafId = 0;
let lastVideoTime = -1;
let lastInferTs = 0;
let targetInferMs = 66; // ~15 fps floor when throttling
let adaptiveGap = 33;
let fpsEMA = 0;
let frameCount = 0;
let fpsWindowStart = performance.now();

const settings = loadSettings();
syncSettingUI();

const session = {
  reps: 0,
  state: "standing", // standing | bottom
  minKnee: 180,
  maxLean: 0,
  depthOk: false,
  perRep: [],
  startedAt: null,
};

function loadSettings() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_SET) || "{}");
    return {
      downAngle: raw.downAngle ?? 100,
      upAngle: raw.upAngle ?? 160,
      depthAngle: raw.depthAngle ?? 90,
      leanWarn: raw.leanWarn ?? 35,
    };
  } catch {
    return { downAngle: 100, upAngle: 160, depthAngle: 90, leanWarn: 35 };
  }
}
function saveSettings() {
  localStorage.setItem(LS_SET, JSON.stringify(settings));
}
function syncSettingUI() {
  els.rngDown.value = settings.downAngle;
  els.rngUp.value = settings.upAngle;
  els.rngDepth.value = settings.depthAngle;
  els.rngLean.value = settings.leanWarn;
  els.downLabel.textContent = settings.downAngle;
  els.upLabel.textContent = settings.upAngle;
  els.depthLabel.textContent = settings.depthAngle;
  els.leanLabel.textContent = settings.leanWarn;
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }
  catch { return []; }
}
function saveHistory(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 100)));
}
function renderHistory() {
  const list = loadHistory();
  if (!list.length) {
    els.histTableWrap.innerHTML = '<p class="tiny">尚無紀錄</p>';
    return;
  }
  const rows = list.map(s => `<tr>
    <td>${escapeHtml(s.date)}</td>
    <td>${s.reps}</td>
    <td>${s.avgDepth ?? "—"}°</td>
    <td>${s.bestDepth ?? "—"}°</td>
    <td>${s.avgLean ?? "—"}°</td>
  </tr>`).join("");
  els.histTableWrap.innerHTML = `<table>
    <thead><tr><th>日期</th><th>次數</th><th>平均深度</th><th>最深</th><th>平均前傾</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setCue(text, kind = "") {
  els.cue.textContent = text;
  els.cue.className = kind;
}
function setStatus(t) { els.statusText.textContent = t; }

function speak(text) {
  if (!els.chkVoice.checked) return;
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-TW";
    u.rate = 1.05;
    window.speechSynthesis.speak(u);
  } catch {}
}

async function requestWakeLock() {
  try {
    if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
  } catch {}
}
async function releaseWakeLock() {
  try { await wakeLock?.release(); } catch {}
  wakeLock = null;
}

function angleDeg(a, b, c) {
  const abx = a.x - b.x, aby = a.y - b.y;
  const cbx = c.x - b.x, cby = c.y - b.y;
  const dot = abx * cbx + aby * cby;
  const cross = abx * cby - aby * cbx;
  let ang = Math.abs(Math.atan2(cross, dot) * 180 / Math.PI);
  if (ang > 180) ang = 360 - ang;
  return ang;
}

function torsoLeanDeg(shoulder, hip) {
  // image y grows downward; vertical up is (0,-1)
  const dx = shoulder.x - hip.x;
  const dy = shoulder.y - hip.y;
  const lean = Math.atan2(dx, -dy) * 180 / Math.PI;
  return Math.abs(lean);
}

function vis(lm) {
  return (lm?.visibility ?? lm?.presence ?? 1) > 0.5;
}

function pickSide(landmarks) {
  // Auto-pick more visible side by average visibility of hip/knee/ankle
  const L = [23, 25, 27].map(i => landmarks[i]);
  const R = [24, 26, 28].map(i => landmarks[i]);
  const score = arr => arr.reduce((s, p) => s + (p.visibility ?? p.presence ?? 0), 0);
  return score(L) >= score(R) ? "left" : "right";
}

function getSideJoints(landmarks, side) {
  if (side === "left") {
    return {
      shoulder: landmarks[11],
      hip: landmarks[23],
      knee: landmarks[25],
      ankle: landmarks[27],
    };
  }
  return {
    shoulder: landmarks[12],
    hip: landmarks[24],
    knee: landmarks[26],
    ankle: landmarks[28],
  };
}

function resizeCanvas() {
  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;
  if (canvas.width !== vw || canvas.height !== vh) {
    canvas.width = vw;
    canvas.height = vh;
  }
}

function updateMirrorClass() {
  const mirror = facingMode === "user";
  canvas.classList.toggle("mirror", mirror);
}

async function listAndStartCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  const constraints = {
    audio: false,
    video: {
      facingMode: { ideal: facingMode },
      width: { ideal: 1280 },
      height: { ideal: 720 },
    }
  };
  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    // fallback without facingMode ideal
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
  }
  video.srcObject = stream;
  await video.play();
  updateMirrorClass();
  resizeCanvas();
}

async function createLandmarker(delegate) {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"
  );
  return PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate,
    },
    runningMode: "VIDEO",
    numPoses: 1,
    minPoseDetectionConfidence: 0.5,
    minPosePresenceConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });
}

async function initModel() {
  setStatus("載入模型中…");
  try {
    poseLandmarker = await createLandmarker("GPU");
    setStatus("模型就緒（GPU）");
  } catch (e) {
    console.warn("GPU failed, falling back to CPU", e);
    poseLandmarker = await createLandmarker("CPU");
    setStatus("模型就緒（CPU）");
  }
  drawingUtils = new DrawingUtils(ctx);
}

function resetSessionCounters() {
  session.reps = 0;
  session.state = "standing";
  session.minKnee = 180;
  session.maxLean = 0;
  session.depthOk = false;
  session.perRep = [];
  session.startedAt = new Date().toISOString();
  els.repVal.textContent = "0";
  els.stateChip.textContent = "站立";
}

function finishAndSaveSession() {
  if (!session.perRep.length && session.reps === 0) {
    setCue("沒有完成的次數", "warn");
    return;
  }
  const depths = session.perRep.map(r => r.depth);
  const leans = session.perRep.map(r => r.lean);
  const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0) / arr.length) : null;
  const best = arr => arr.length ? Math.round(Math.min(...arr)) : null; // smaller knee angle = deeper
  const rec = {
    date: new Date().toLocaleString("zh-TW", { hour12: false }),
    iso: new Date().toISOString(),
    reps: session.reps,
    avgDepth: avg(depths),
    bestDepth: best(depths),
    avgLean: avg(leans),
    view: viewMode,
  };
  const list = loadHistory();
  list.unshift(rec);
  saveHistory(list);
  renderHistory();
  setCue(`已儲存 ${rec.reps} 下`, "ok");
  speak(`完成 ${rec.reps} 下`);
}

function analyze(landmarks) {
  let cue = "";
  let cueKind = "";
  let primaryAngle = null;
  let secondary = null;

  if (viewMode === "side") {
    const side = pickSide(landmarks);
    const j = getSideJoints(landmarks, side);
    if (!vis(j.hip) || !vis(j.knee) || !vis(j.ankle)) {
      setCue("請讓全身入鏡", "warn");
      els.angVal.textContent = "—";
      els.hipVal.textContent = "—";
      els.secVal.textContent = "—";
      return null;
    }
    const knee = angleDeg(j.hip, j.knee, j.ankle);
    const hipAng = angleDeg(j.shoulder, j.hip, j.knee);
    const lean = torsoLeanDeg(j.shoulder, j.hip);
    primaryAngle = knee;
    secondary = lean;

    els.angLabel.textContent = `膝蓋角(${side === "left" ? "左" : "右"})`;
    els.hipLabel.textContent = "髖角";
    els.secLabel.textContent = "軀幹前傾";
    els.angVal.textContent = Math.round(knee);
    els.hipVal.textContent = Math.round(hipAng);
    els.secVal.textContent = Math.round(lean);

    // depth: knee angle small OR hip crease at/below knee (hip.y >= knee.y)
    const depthByAngle = knee <= settings.depthAngle;
    const depthByHip = j.hip.y >= j.knee.y - 0.01;
    const depthNow = depthByAngle || depthByHip;

    if (running) {
      session.minKnee = Math.min(session.minKnee, knee);
      session.maxLean = Math.max(session.maxLean, lean);
      if (depthNow) session.depthOk = true;

      if (session.state === "standing" && knee < settings.downAngle) {
        session.state = "bottom";
        els.stateChip.textContent = "蹲底";
      } else if (session.state === "bottom" && knee > settings.upAngle) {
        session.state = "standing";
        session.reps += 1;
        els.repVal.textContent = String(session.reps);
        els.stateChip.textContent = "站立";
        const rep = {
          depth: Math.round(session.minKnee),
          lean: Math.round(session.maxLean),
          depthOk: session.depthOk,
        };
        session.perRep.push(rep);
        speak(String(session.reps));
        session.minKnee = 180;
        session.maxLean = 0;
        session.depthOk = false;
        if (!rep.depthOk) {
          cue = "再蹲低一點";
          cueKind = "warn";
        } else if (rep.lean >= settings.leanWarn) {
          cue = "上身太前傾";
          cueKind = "warn";
        } else {
          cue = "深度OK";
          cueKind = "ok";
        }
      } else {
        if (session.state === "bottom" || knee < settings.upAngle - 10) {
          if (lean >= settings.leanWarn) { cue = "上身太前傾"; cueKind = "warn"; }
          else if (depthNow) { cue = "深度OK"; cueKind = "ok"; }
          else { cue = "再蹲低一點"; cueKind = "warn"; }
        } else {
          cue = "開始下蹲";
          cueKind = "";
        }
      }
    } else {
      cue = "按開始偵測";
    }

    // draw highlight joints
    return { knee, hipAng, lean, side, joints: j, cue, cueKind };
  }

  // front view
  const lh = landmarks[23], lk = landmarks[25], la = landmarks[27];
  const rh = landmarks[24], rk = landmarks[26], ra = landmarks[28];
  const lKnee = angleDeg(lh, lk, la);
  const rKnee = angleDeg(rh, rk, ra);
  const diff = Math.abs(lKnee - rKnee);
  primaryAngle = (lKnee + rKnee) / 2;
  secondary = diff;

  els.angLabel.textContent = "左膝";
  els.hipLabel.textContent = "右膝";
  els.secLabel.textContent = "左右差";
  els.angVal.textContent = Math.round(lKnee);
  els.hipVal.textContent = Math.round(rKnee);
  els.secVal.textContent = Math.round(diff);

  // valgus: knee x should stay roughly outside relative to ankle toward hip line
  // For front view (not mirrored logic on landmarks — landmarks are in image space before CSS mirror)
  // Knee collapsing inward: for left leg, knee.x > ankle.x (toward midline) when person faces camera
  // Midline approx (lh.x+rh.x)/2
  const mid = ((lh?.x ?? 0.5) + (rh?.x ?? 0.5)) / 2;
  const leftValgus = lk && la && (Math.abs(lk.x - mid) < Math.abs(la.x - mid) - 0.02);
  const rightValgus = rk && ra && (Math.abs(rk.x - mid) < Math.abs(ra.x - mid) - 0.02);
  const valgus = leftValgus || rightValgus;

  const knee = primaryAngle;
  if (running) {
    session.minKnee = Math.min(session.minKnee, knee);
    session.maxLean = Math.max(session.maxLean, diff); // reuse field as asymmetry in front mode
    const depthNow = knee <= settings.depthAngle || ((lh.y + rh.y) / 2 >= (lk.y + rk.y) / 2);
    if (depthNow) session.depthOk = true;

    if (session.state === "standing" && knee < settings.downAngle) {
      session.state = "bottom";
      els.stateChip.textContent = "蹲底";
    } else if (session.state === "bottom" && knee > settings.upAngle) {
      session.state = "standing";
      session.reps += 1;
      els.repVal.textContent = String(session.reps);
      els.stateChip.textContent = "站立";
      const rep = {
        depth: Math.round(session.minKnee),
        lean: Math.round(session.maxLean),
        depthOk: session.depthOk,
      };
      session.perRep.push(rep);
      speak(String(session.reps));
      session.minKnee = 180;
      session.maxLean = 0;
      session.depthOk = false;
      if (valgus) { cue = "膝蓋內夾"; cueKind = "bad"; }
      else if (!rep.depthOk) { cue = "再蹲低一點"; cueKind = "warn"; }
      else { cue = "深度OK"; cueKind = "ok"; }
    } else {
      if (valgus) { cue = "膝蓋內夾"; cueKind = "bad"; }
      else if (session.state === "bottom" || knee < settings.upAngle - 10) {
        cue = depthNow ? "深度OK" : "再蹲低一點";
        cueKind = depthNow ? "ok" : "warn";
      } else {
        cue = "開始下蹲";
      }
    }
  } else {
    cue = "按開始偵測";
  }

  return { knee, lKnee, rKnee, diff, valgus, cue, cueKind };
}

function drawOverlay(landmarks, info) {
  resizeCanvas();
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  try {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  } catch {}
  if (!landmarks) { ctx.restore(); return; }

  const connector = PoseLandmarker.POSE_CONNECTIONS;
  drawingUtils.drawConnectors(landmarks, connector, { color: "#3ddc97", lineWidth: 4 });
  drawingUtils.drawLandmarks(landmarks, { color: "#ffffff", fillColor: "#1b2740", radius: 5, lineWidth: 1 });

  if (viewMode === "side" && info?.joints) {
    const j = info.joints;
    const x = j.knee.x * canvas.width;
    const y = j.knee.y * canvas.height;
    ctx.fillStyle = "#ffb020";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText(`${Math.round(info.knee)}°`, x + 12, y - 12);
    if (info.hipAng != null) {
      const hx = j.hip.x * canvas.width;
      const hy = j.hip.y * canvas.height;
      ctx.fillStyle = "#7dd3fc";
      ctx.fillText(`髖 ${Math.round(info.hipAng)}°`, hx + 12, hy - 12);
    }
  }
  ctx.restore();
}

function tickFps() {
  frameCount += 1;
  const now = performance.now();
  if (now - fpsWindowStart >= 1000) {
    const fps = frameCount * 1000 / (now - fpsWindowStart);
    fpsEMA = fpsEMA ? fpsEMA * 0.7 + fps * 0.3 : fps;
    els.fpsChip.textContent = `${Math.round(fpsEMA)} FPS`;
    // adapt inference gap for old phones
    if (fpsEMA < 12) adaptiveGap = Math.min(100, adaptiveGap + 8);
    else if (fpsEMA > 20 && adaptiveGap > 33) adaptiveGap = Math.max(33, adaptiveGap - 4);
    frameCount = 0;
    fpsWindowStart = now;
  }
}

function loop() {
  rafId = requestAnimationFrame(loop);
  if (!poseLandmarker) return;
  if (video.readyState < 2) return;

  const now = performance.now();
  tickFps();

  if (now - lastInferTs < adaptiveGap) {
    return;
  }
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  lastInferTs = now;

  const t0 = performance.now();
  let result;
  try {
    result = poseLandmarker.detectForVideo(video, now);
  } catch (e) {
    console.warn(e);
    return;
  }
  const inferMs = performance.now() - t0;
  if (inferMs > 80) adaptiveGap = Math.min(120, Math.max(adaptiveGap, inferMs * 1.2));

  const landmarks = result?.landmarks?.[0];
  if (!landmarks) {
    drawOverlay(null, null);
    setCue("找不到人，請全身入鏡", "warn");
    return;
  }
  const info = analyze(landmarks);
  if (info?.cue) setCue(info.cue, info.cueKind || "");
  drawOverlay(landmarks, info);
}

async function startDetection() {
  if (!poseLandmarker) await initModel();
  if (!stream) await listAndStartCamera();
  resetSessionCounters();
  running = true;
  els.btnStart.disabled = true;
  els.btnStop.disabled = false;
  await requestWakeLock();
  setCue("開始下蹲", "");
  setStatus("偵測中");
  cancelAnimationFrame(rafId);
  lastVideoTime = -1;
  loop();
}

async function stopDetection() {
  running = false;
  els.btnStart.disabled = false;
  els.btnStop.disabled = true;
  await releaseWakeLock();
  finishAndSaveSession();
  setStatus("已停止");
  els.stateChip.textContent = "待機";
}

// UI bindings
els.btnBootStart.addEventListener("click", async () => {
  errEl.textContent = "";
  try {
    if (!window.isSecureContext && location.hostname !== "localhost") {
      throw new Error("相機需要 HTTPS。請用提供的網址開啟，不要用檔案直接打開。");
    }
    setStatus("初始化…");
    await initModel();
    await listAndStartCamera();
    boot.classList.add("hidden");
    cancelAnimationFrame(rafId);
    loop(); // preview overlay even before counting
    setStatus("就緒，按開始偵測");
    setCue("按開始偵測", "");
  } catch (e) {
    console.error(e);
    errEl.textContent = "啟動失敗：" + (e.message || e);
  }
});

els.btnStart.addEventListener("click", () => startDetection().catch(e => {
  setStatus("錯誤");
  setCue(e.message || String(e), "bad");
}));
els.btnStop.addEventListener("click", () => stopDetection());

els.btnToggleView.addEventListener("click", () => {
  viewMode = viewMode === "side" ? "front" : "side";
  els.btnToggleView.textContent = viewMode === "side" ? "檢視：側面" : "檢視：正面";
  if (viewMode === "side") {
    els.angLabel.textContent = "膝蓋角";
    els.secLabel.textContent = "軀幹前傾";
  } else {
    els.angLabel.textContent = "左 / 右膝";
    els.secLabel.textContent = "左右差";
  }
});

els.btnCam.addEventListener("click", async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  els.btnCam.textContent = facingMode === "environment" ? "鏡頭：後" : "鏡頭：前";
  try {
    await listAndStartCamera();
  } catch (e) {
    setCue("切換鏡頭失敗", "bad");
  }
});

els.btnSettings.addEventListener("click", () => els.settingsModal.classList.add("show"));
els.btnCloseSettings.addEventListener("click", () => {
  settings.downAngle = Number(els.rngDown.value);
  settings.upAngle = Number(els.rngUp.value);
  settings.depthAngle = Number(els.rngDepth.value);
  settings.leanWarn = Number(els.rngLean.value);
  if (settings.downAngle >= settings.upAngle - 20) {
    settings.downAngle = Math.min(settings.downAngle, settings.upAngle - 30);
    syncSettingUI();
  }
  saveSettings();
  els.settingsModal.classList.remove("show");
});
["rngDown","rngUp","rngDepth","rngLean"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    els.downLabel.textContent = els.rngDown.value;
    els.upLabel.textContent = els.rngUp.value;
    els.depthLabel.textContent = els.rngDepth.value;
    els.leanLabel.textContent = els.rngLean.value;
  });
});

els.btnExport.addEventListener("click", () => {
  const list = loadHistory();
  const header = "date,reps,avgDepth,bestDepth,avgLean,view\n";
  const body = list.map(s =>
    [s.date, s.reps, s.avgDepth ?? "", s.bestDepth ?? "", s.avgLean ?? "", s.view ?? ""]
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")
  ).join("\n");
  const blob = new Blob([header + body], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "squat-history.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

els.btnClearHist.addEventListener("click", () => {
  if (confirm("確定清除所有訓練紀錄？")) {
    saveHistory([]);
    renderHistory();
  }
});

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && running) await requestWakeLock();
});
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 300));

renderHistory();

// Expose tiny test hook for headless checks
window.__squatCoach = {
  angleDeg, torsoLeanDeg, settings, loadHistory, version: "1.0.0"
};
</script>
